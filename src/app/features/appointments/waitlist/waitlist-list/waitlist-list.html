<div class="space-y-24">
  <div class="flex flex-wrap items-center justify-between gap-16">
    <div>
      <h1 class="text-heading text-ink">Lista de espera</h1>
      <p class="mt-4 text-body text-mid-gray">
        Gestiona los pacientes interesados en recuperar un horario.
      </p>
    </div>
    <app-button variant="primary" icon="plus" (clicked)="openCreate()">Nueva entrada</app-button>
  </div>

  @if (loadError()) {
    <section class="rounded-card bg-paper p-24 text-center shadow-resting" role="alert">
      <p class="text-body text-danger-deep">No pudimos cargar la lista de espera.</p>
      <app-button class="mt-12" variant="secondary" (clicked)="retry()">Reintentar</app-button>
    </section>
  } @else {
    <app-table
      [columns]="columns"
      [rows]="rows()"
      [total]="total()"
      [loading]="loading()"
      [query]="query()"
      [rowActions]="rowActions"
      emptyMessage="No hay entradas para mostrar"
      (queryChange)="onQueryChange($event)"
    >
      <ng-template #rowActions let-row>
        <app-waitlist-row-actions [entry]="entry(row)" (updated)="onEntryUpdated()" />
      </ng-template>
      <ng-template appCell="patient" let-row>
        @if (patientRoute(entry(row)); as route) {
          <app-link [route]="route">{{ patientName(entry(row)) }}</app-link>
        } @else {
          <span>{{ patientName(entry(row)) }}</span>
        }
      </ng-template>
    </app-table>
  }

  <ng-template #createTemplate>
    <app-waitlist-create-dialog (saved)="onCreateSaved()" (cancelled)="onCreateCancelled()" />
  </ng-template>
</div>
