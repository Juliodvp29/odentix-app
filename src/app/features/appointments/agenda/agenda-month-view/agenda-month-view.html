<div class="space-y-8" role="grid" aria-label="Mes">
  <div class="grid grid-cols-7 gap-4 text-center text-caption font-medium text-mid-gray" role="row">
    <span>Lu</span><span>Ma</span><span>Mi</span><span>Ju</span><span>Vi</span><span>Sá</span
    ><span>Do</span>
  </div>
  @for (week of weeks(); track $index) {
    <div class="grid grid-cols-7 gap-4" role="row">
      @for (day of week; track day.cell.isoDate) {
        <button
          type="button"
          role="gridcell"
          (click)="dayPicked.emit(day.cell.isoDate)"
          [attr.aria-label]="day.cell.dayNumber + ', ' + day.appointments.length + ' citas'"
          [attr.aria-selected]="day.isSelected"
          [class.bg-surface-alt]="!day.cell.inMonth"
          [class.bg-teal]="day.isSelected && day.cell.inMonth"
          [class.text-paper]="day.isSelected && day.cell.inMonth"
          [class.ring-1]="day.isToday && !day.isSelected"
          [class.ring-teal]="day.isToday && !day.isSelected"
          class="min-h-24 rounded-control border border-hairline bg-paper p-8 text-left transition-colors duration-fast hover:border-teal focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal"
        >
          <!-- Day number -->
          <span
            class="text-body font-medium"
            [class.text-mid-gray]="!day.cell.inMonth"
            [class.text-ink]="day.cell.inMonth && !day.isSelected"
          >
            {{ day.cell.dayNumber }}
          </span>

          @if (day.appointments.length > 0) {
            <!-- Count -->
            <span
              class="mt-4 block text-caption font-medium"
              [class.text-teal-deep]="!day.isSelected"
              [class.text-paper]="day.isSelected"
            >
              {{ day.appointments.length }}
              {{ day.appointments.length === 1 ? 'cita' : 'citas' }}
            </span>

            <!-- Status dots row -->
            <span class="mt-4 flex flex-wrap gap-4">
              @for (dot of statusDots(day); track dot.color) {
                <span
                  class="inline-flex items-center gap-2 text-caption"
                  [class.text-paper]="day.isSelected"
                  [class.text-mid-gray]="!day.isSelected"
                >
                  <span class="h-6 w-6 rounded-pill" [class]="dot.color"></span>
                  {{ dot.count }}
                </span>
              }
            </span>
          }
        </button>
      }
    </div>
  }
</div>
