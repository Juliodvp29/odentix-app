<div class="flex min-h-screen bg-canvas">
  <aside
    class="hidden w-full shrink-0 flex-col bg-surface-alt lg:flex"
    style="width: var(--sidebar-width)"
  >
    <div class="flex items-center gap-12 p-24">
      <span
        class="inline-flex h-32 w-32 items-center justify-center rounded-control border border-teal/20 bg-teal/10 text-teal"
      >
        <app-brand-mark size="20" />
      </span>
      <span class="text-heading-sm text-ink">Odentix</span>
    </div>
    <nav aria-label="Principal" class="flex-1 px-16">
      <ul class="space-y-4">
        @for (item of visibleItems(); track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              [routerLinkActive]="['bg-teal-soft', 'text-teal-deep']"
              #rla="routerLinkActive"
              [class.text-mid-gray]="!rla.isActive"
              [routerLinkActiveOptions]="{ exact: !!item.exact }"
              ariaCurrentWhenActive="page"
              class="flex items-center gap-12 rounded-control px-12 py-8 text-body font-medium transition-colors duration-fast hover:bg-hairline"
            >
              <app-icon [name]="item.icon" />
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
    <div class="p-16">
      <div class="flex items-center gap-12 rounded-card bg-paper p-12 shadow-resting">
        <span
          class="inline-flex h-32 w-32 shrink-0 items-center justify-center rounded-pill bg-teal-soft text-caption font-medium text-teal-deep"
        >
          {{ initials() }}
        </span>
        <span class="min-w-0 flex-1">
          <p class="truncate text-body font-medium text-ink">{{ user()?.fullName }}</p>
          <p class="text-caption text-mid-gray">{{ roleLabel() }}</p>
        </span>
        <app-icon-button label="Cerrar sesión" (clicked)="logout()">
          <app-icon name="log-out" />
        </app-icon-button>
      </div>
    </div>
  </aside>
  <div class="flex min-w-0 flex-1 flex-col">
    <header class="border-b border-hairline bg-paper lg:hidden">
      <nav aria-label="Principal" class="flex items-center gap-8 overflow-x-auto p-12">
        <span class="inline-flex h-32 w-32 shrink-0 items-center justify-center text-teal">
          <app-brand-mark size="20" />
        </span>
        @for (item of visibleItems(); track item.path) {
          <a
            [routerLink]="item.path"
            [routerLinkActive]="['bg-teal-soft', 'text-teal-deep']"
            #mobileRla="routerLinkActive"
            [class.text-mid-gray]="!mobileRla.isActive"
            [routerLinkActiveOptions]="{ exact: !!item.exact }"
            ariaCurrentWhenActive="page"
            class="flex shrink-0 items-center gap-8 rounded-pill px-12 py-8 text-body font-medium transition-colors duration-fast"
          >
            <app-icon [name]="item.icon" />
            {{ item.label }}
          </a>
        }
      </nav>
    </header>
    <main class="mx-auto w-full flex-1 p-24" style="max-width: var(--content-max-width)">
      <router-outlet />
    </main>
  </div>
  <app-toasts />
</div>
